spring.application.name=gestion-conges

spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_conges
spring.datasource.username=postgres
spring.datasource.password=postgress

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.access=DEBUG

# Configuration LeaveFlow injectée avec @Value
leaveflow.conges.jours-par-defaut=30
leaveflow.invitation.validite-jours=7