spring.application.name=gestion-conges

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_conges}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web.access=INFO

# Configuration LeaveFlow injectée avec @Value
leaveflow.conges.jours-par-defaut=30
leaveflow.invitation.validite-jours=7
# Cookie de session : HttpOnly (géré par le serveur)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
