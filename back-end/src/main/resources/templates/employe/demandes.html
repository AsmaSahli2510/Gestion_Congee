<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mes demandes de congé</title>
</head>

<body>
    <h1>Mes demandes de congé</h1>
    <p>Bienvenue dans votre espace employé.</p>

    <p th:if="${#lists.isEmpty(demandes)}">
        Vous n'avez pas encore de demande de congé.
    </p>

    <table th:if="${not #lists.isEmpty(demandes)}" border="1">
        <thead>
            <tr>
                <th>Date de début</th>
                <th>Date de fin</th>
                <th>Statut</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="demande : ${demandes}">
                <td th:text="${demande.dateDebut}"></td>
                <td th:text="${demande.dateFin}"></td>
                <td th:text="${demande.statut}"></td>
            </tr>
        </tbody>
    </table>

    <p>
        <a th:href="@{/demandes/nouvelle}">
            Créer une nouvelle demande
        </a>
    </p>
</body>

</html>
