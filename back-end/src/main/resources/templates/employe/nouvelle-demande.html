
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nouvelle demande | Gestion des Congés</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #1e293b; }
        .layout { display: flex; min-height: 100vh; }
        aside { width: 245px; background: #312e81; color: white; padding: 28px 18px; flex-shrink: 0; }
        .brand { font-size: 19px; font-weight: bold; margin-bottom: 38px; }
        .nav-title { color: #c7d2fe; font-size: 11px; text-transform: uppercase; margin: 24px 10px 12px; }
        nav a { display: block; padding: 13px 12px; margin: 5px 0; color: #e0e7ff; text-decoration: none; border-radius: 8px; }
        nav a.active, nav a:hover { background: #4f46e5; }
        main { flex: 1; min-width: 0; }
        header { background: white; padding: 22px 32px; border-bottom: 1px solid #e2e8f0; }
        .content { padding: 32px; }
        h1 { margin: 0; font-size: 26px; }
        h2 { margin-top: 0; font-size: 19px; }
        .muted { color: #64748b; }
        .subtitle { margin: 9px 0 26px; color: #64748b; }
        .panel { max-width: 800px; background: white; border: 1px solid #e8edf4; border-radius: 14px; padding: 28px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .field { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        input, select, textarea { width: 100%; padding: 12px 13px; border: 1px solid #cbd5e1; border-radius: 9px; font: inherit; background: white; }
        input:focus, select:focus, textarea:focus { outline: 2px solid #c7d2fe; border-color: #4f46e5; }
        textarea { min-height: 110px; resize: vertical; }
        .button { display: inline-block; border: 0; border-radius: 9px; padding: 13px 18px; background: #4f46e5; color: white; font-weight: bold; cursor: pointer; text-decoration: none; }
        .button:hover { background: #4338ca; }
        .secondary { background: #e2e8f0; color: #334155; margin-left: 8px; }
        .error { padding: 12px; border-radius: 9px; background: #fee2e2; color: #991b1b; margin-bottom: 18px; }
        .success { padding: 12px; border-radius: 9px; background: #dcfce7; color: #166534; margin-bottom: 18px; }
        @media(max-width: 800px) { .layout { display: block; } aside { width: 100%; } .content { padding: 18px; } header { padding: 18px; } .grid { grid-template-columns: 1fr; gap: 0; } .panel { padding: 20px; } }
    </style>
</head>
<body>
<div class="layout">
    <aside>
        <div class="brand">Gestion des Congés</div>
        <div class="nav-title">Espace employé</div>
        <nav>
            <a th:href="@{/demandes}">📋 Mes demandes</a>
            <a class="active" th:href="@{/demandes/nouvelle}">➕ Nouvelle demande</a>
        </nav>
        <div class="nav-title">Compte</div>
        <nav>
            <a th:href="@{/}">🏠 Accueil</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" style="width:100%;padding:13px 12px;text-align:left;background:transparent;border:0;color:#e0e7ff;cursor:pointer;font-size:15px">↪ Déconnexion</button>
            </form>
        </nav>
    </aside>

    <main>
        <header>
            <h1>Nouvelle demande de congé</h1>
            <div class="muted">Complétez le formulaire ci-dessous</div>
        </header>

        <div class="content">
            <p class="subtitle">Vérifiez les dates avant d'envoyer votre demande.</p>

            <div class="error" th:if="${erreur}" th:text="${erreur}"></div>
            <div class="success" th:if="${succes}" th:text="${succes}"></div>

            <section class="panel">
                <h2>Informations du congé</h2>

                <form th:action="@{/demandes/nouvelle}" th:object="${demande}" method="post">
                    <div class="grid">
                        <div class="field">
                            <label for="typeConge">Type de congé</label>
                            <select id="typeConge" th:field="*{typeConge}" required>
                                <option value="">-- Choisir un type --</option>
                                <option value="ANNUEL">Congé annuel</option>
                                <option value="MALADIE">Congé maladie</option>
                                <option value="EXCEPTIONNEL">Congé exceptionnel</option>
                                <option value="SANS_SOLDE">Congé sans solde</option>
                                <option value="MATERNITE">Congé maternité</option>
                                <option value="PATERNITE">Congé paternité</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="dateDebut">Date de début</label>
                            <input id="dateDebut" type="date" th:field="*{dateDebut}" required>
                        </div>

                        <div class="field">
                            <label for="dateFin">Date de fin</label>
                            <input id="dateFin" type="date" th:field="*{dateFin}" required>
                        </div>
                    </div>

                    <div class="field">
                        <label for="motif">Motif de la demande</label>
                        <textarea id="motif" th:field="*{motif}" placeholder="Expliquez brièvement le motif de votre demande..." required></textarea>
                    </div>

                    <button class="button" type="submit">Envoyer la demande</button>
                    <a class="button secondary" th:href="@{/demandes}">Annuler</a>
                </form>
            </section>
        </div>
    </main>
</div>
</body>
</html>
