<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Gestion des Congés</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
            color: #1e293b;
        }

        .login-card {
            width: 100%;
            max-width: 410px;
            margin: 20px;
            padding: 36px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
        }

        .logo {
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
            border-radius: 14px;
            background: #2563eb;
            color: white;
            font-size: 25px;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 25px;
        }

        .subtitle {
            margin-bottom: 28px;
            color: #64748b;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #bfdbfe;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px; 
            font-size: 14px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <main class="login-card">

        <div class="logo">✓</div>

        <h1>Bienvenue</h1>
        <p class="subtitle">
            Connectez-vous à votre espace de gestion des congés.
        </p>

        <div th:if="${param.error}" class="message error">
            E-mail ou mot de passe incorrect.
        </div>

        <div th:if="${param.logout}" class="message success">
            Vous avez été déconnecté avec succès.
        </div>

        <form th:action="@{/login}" method="post">

            <label for="username">Adresse e-mail</label>
            <input type="email" id="username" name="username" placeholder="exemple@email.com" autocomplete="username"
                required>

            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="Votre mot de passe"
                autocomplete="current-password" required>

            <button type="submit">Se connecter</button>
        </form>
        <p>
            Don't have an account?
            <a th:href="@{/register}">Create one</a>
        </p>
        <div class="footer">
            Gestion des Congés · Accès sécurisé
        </div>

    </main>
</body>

</html>
